<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceNow Services Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
        .service-card:hover {
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-[#0b4d8c]">ServiceNow Directory</h1>
                <div class="relative">
                    <input type="text" id="search" placeholder="Search services..." 
                           class="pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0b4d8c] focus:border-transparent">
                    <i class="bi bi-search absolute left-3 top-3 text-gray-400"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Services will be dynamically populated here -->
        </div>
    </main>

    <script>
        const services = [
            {
                name: "IT Service Management",
                description: "Streamline and automate IT services to enhance productivity",
                icon: "bi-gear-fill",
                category: "IT Operations"
            },
            {
                name: "Customer Service Management",
                description: "Deliver effortless customer service experiences",
                icon: "bi-people-fill",
                category: "Customer Service"
            },
            {
                name: "HR Service Delivery",
                description: "Transform the employee service experience",
                icon: "bi-person-badge-fill",
                category: "Human Resources"
            },
            {
                name: "Security Operations",
                description: "Respond faster to security incidents and vulnerabilities",
                icon: "bi-shield-fill",
                category: "Security"
            },
            {
                name: "App Engine",
                description: "Build and scale apps quickly on the Now Platform",
                icon: "bi-code-square",
                category: "Development"
            },
            {
                name: "Asset Management",
                description: "Track and manage IT assets throughout their lifecycle",
                icon: "bi-box-fill",
                category: "IT Operations"
            }
        ];

        function createServiceCard(service) {
            return `
                <div class="service-card bg-white p-6 rounded-lg shadow-md hover:shadow-lg">
                    <div class="flex items-center justify-between mb-4">
                        <i class="${service.icon} text-3xl text-[#0b4d8c]"></i>
                        <span class="text-sm font-medium text-gray-500">${service.category}</span>
                    </div>
                    <h3 class="text-xl font-semibold mb-2">${service.name}</h3>
                    <p class="text-gray-600">${service.description}</p>
                    <button class="mt-4 text-[#0b4d8c] hover:text-[#083a6b] font-medium flex items-center">
                        Learn more
                        <i class="bi bi-arrow-right ml-2"></i>
                    </button>
                </div>
            `;
        }

        function renderServices(filteredServices = services) {
            const servicesGrid = document.getElementById('services-grid');
            servicesGrid.innerHTML = filteredServices
                .map(service => createServiceCard(service))
                .join('');
        }

        // Initialize services
        renderServices();

        // Search functionality
        document.getElementById('search').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredServices = services.filter(service => 
                service.name.toLowerCase().includes(searchTerm) ||
                service.description.toLowerCase().includes(searchTerm) ||
                service.category.toLowerCase().includes(searchTerm)
            );
            renderServices(filteredServices);
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
